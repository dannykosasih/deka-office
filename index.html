<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeKa Office</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; color: #e8eef8; font-family: system-ui, sans-serif; }
  #title { position: fixed; left: 20px; top: 16px; }
  #title h1 { font-size: 20px; margin: 0; font-weight: 600; }
  #title p { margin: 4px 0 0; font-size: 13px; opacity: 0.7; }
  #legend { position: fixed; left: 20px; bottom: 16px; font-size: 13px; opacity: 0.85; display: flex; gap: 14px; }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--c); }
  #panel { position: fixed; right: 16px; top: 16px; width: 280px; background: rgba(20,28,48,0.92); border: 1px solid #2a3756; border-radius: 12px; padding: 16px; display: none; }
  #panel h2 { margin: 0 0 4px; font-size: 18px; }
  #panel .team { font-size: 12px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.06em; }
  #panel .role { font-size: 14px; line-height: 1.45; margin: 10px 0; }
  #panel .now { font-size: 14px; padding: 8px 10px; background: #18213a; border-radius: 8px; }
  #panel .close { position: absolute; right: 12px; top: 8px; cursor: pointer; opacity: 0.6; }
  .tag { font-size: 11px; padding: 3px 7px; border-radius: 8px; background: rgba(13,18,32,0.85); border: 1px solid #33415f; white-space: nowrap; pointer-events: none; text-align: center; }
  .tag b { display: block; font-size: 12px; }
  .tag i { font-style: normal; opacity: 0.75; }
  .zone { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; pointer-events: none; }
  .portrait { width: 88px; height: 88px; border-radius: 18px; object-fit: cover; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 6px 18px rgba(0,0,0,0.45); pointer-events: none; background: #1b2438; }
  .portrait-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="title"><h1>DeKa Office</h1><p id="updated">Loading status...</p></div>
<div id="legend"><span style="--c:#4ade80">Working</span><span style="--c:#fbbf24">Waiting on Danny</span><span style="--c:#64748b">Idle</span></div>
<div id="panel"><span class="close" onclick="this.parentNode.style.display='none'">x</span>
  <div class="team" id="p-team"></div><h2 id="p-name"></h2><div class="role" id="p-role"></div><div class="now" id="p-now"></div></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const PORTRAITS = {
  story: "portraits/story.png",
  cos: "portraits/cos.png",
  botres: "portraits/botres.png",
  data: "portraits/data.png",
  design: "portraits/design.png",
  brain: "portraits/brain.png",
  engineer: "portraits/engineer.png",
  research: "portraits/research.png",
  slide: "portraits/slide.png",
  social: "portraits/social.png"
};
const VOXEL_IDS = ["cos","research","data","slide","social","engineer","design","story","botres","brain"];
const VOXEL_FILE = { story: "purple", botres: "teal", brain: "maroon" };
const voxelCache = {};
const ZONES = [
  { name: "Leadership",      color: 0x7eb6ff, x: -13, z: -7, bots: [
    ["danny", "Danny", "You. Every ask starts here."],
    ["cos", "Chief of Staff", "Turns Danny's asks into work across the bots and keeps the team aligned."],
    ["botres", "Bot Resources", "Job descriptions and policies for how the bots work together."] ] },
  { name: "Research & Data", color: 0x8fd0b0, x: 0, z: -7, bots: [
    ["research", "Research", "Finds and sources information on the web."],
    ["data", "Data", "Collects, cleans, analyzes, and interprets data."],
    ["aidigest", "AI Digest", "AI news digest."] ] },
  { name: "Engineering",     color: 0x22d3ee, x: 13, z: -7, bots: [
    ["engineer", "Engineer", "Code, automations, bot team tooling, and Sheets engineering."] ] },
  { name: "Content",         color: 0xe07a5f, x: -13, z: 7, bots: [
    ["slide", "Slide", "Designs and produces slide decks."],
    ["social", "Social", "Scripts and posts content for Instagram, LinkedIn, and YouTube."],
    ["learning", "Learning Material Team", "Learning materials."],
    ["thinking", "Thinking Intelligence", "Danny's book on thinking intelligence in the AI era."],
    ["design", "Design", "Icons, logos, pictures, and illustrations for Danny and the bot team."],
    ["story", "Storytelling", "Writes the stories behind Danny's Instagram, LinkedIn, and YouTube content."] ] },
  { name: "Personal",        color: 0xc4b5fd, x: 0, z: 7, bots: [
    ["brain", "2nd Brain", "Notes, priorities, decisions, and reminders."],
    ["travel", "Travel", "Plans and arranges Danny's travel."],
    ["expense", "Expense", "Tracks daily expenses."],
    ["health", "Health", "Tracks Danny's health."] ] },
  { name: "Project Teams",   color: 0xf0b429, x: 13, z: 7, bots: [
    ["strategy", "Strategy Team", "Strategy work."],
    ["proposal", "Proposal Team", "Client proposals."],
    ["contentteam", "Content Creation Team", "Content creation."] ] }
];
const STATE_COLOR = { working: 0x4ade80, waiting: 0xfbbf24, idle: 0x64748b };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1220);
scene.fog = new THREE.Fog(0x0d1220, 75, 140);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(18, 16, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: "absolute", top: "0", pointerEvents: "none" });
document.body.appendChild(labels.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.2;

// --- Brighter office lighting ---
scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x2a3348, 1.35));
const sun = new THREE.DirectionalLight(0xfff5e6, 1.85);
sun.position.set(12, 28, 14); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0002;
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 28, bottom: -28, near: 1, far: 80 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xb8d0ff, 0.45);
fill.position.set(-18, 20, -10); scene.add(fill);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
const desks = {}, clickable = [];

const FLOOR_W = 56, FLOOR_D = 40, WALL_H = 3.2, WALL_T = 0.28;
const HALF_W = FLOOR_W / 2, HALF_D = FLOOR_D / 2;

function addBox(w, h, d, color, x, y, z, opts = {}) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({
      color, roughness: opts.roughness ?? 0.75, metalness: opts.metalness ?? 0.05,
      transparent: !!opts.opacity, opacity: opts.opacity ?? 1, emissive: opts.emissive ?? 0x000000,
      emissiveIntensity: opts.emissiveIntensity ?? 0
    })
  );
  m.position.set(x, y, z);
  if (opts.rotY) m.rotation.y = opts.rotY;
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  scene.add(m);
  return m;
}

function buildFloor() {
  // Warm wood-tone base floor (lighter so zone rugs read clearly)
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(FLOOR_W, FLOOR_D),
    new THREE.MeshStandardMaterial({ color: 0xc4a574, roughness: 0.85, metalness: 0.02 })
  );
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // Subtle plank lines via faint grid
  const grid = new THREE.GridHelper(FLOOR_W, 28, 0xa8885a, 0xb89668);
  grid.position.y = 0.012;
  (Array.isArray(grid.material) ? grid.material : [grid.material]).forEach(m => { m.transparent = true; m.opacity = 0.28; });
  scene.add(grid);
  // Thin skirting boards along outer walls (inside face)
  const skirtH = 0.18, skirtT = 0.08, skirtC = 0x8b7355;
  addBox(FLOOR_W - 0.4, skirtH, skirtT, skirtC, 0, skirtH / 2, -HALF_D + WALL_T + 0.04, { cast: false });
  addBox(FLOOR_W - 0.4, skirtH, skirtT, skirtC, 0, skirtH / 2, HALF_D - WALL_T - 0.04, { cast: false });
  addBox(skirtT, skirtH, FLOOR_D - 0.4, skirtC, -HALF_W + WALL_T + 0.04, skirtH / 2, 0, { cast: false });
  addBox(skirtT, skirtH, FLOOR_D - 0.4, skirtC, HALF_W - WALL_T - 0.04, skirtH / 2, 0, { cast: false });
}

function buildPerimeterWalls() {
  const wallC = 0xe8e4dc, trimC = 0xd4cfc4;
  // North wall (z = -HALF_D) — solid
  addBox(FLOOR_W, WALL_H, WALL_T, wallC, 0, WALL_H / 2, -HALF_D);
  // South wall with entrance doorway centered (~3.2 wide)
  const doorW = 3.4, sideW = (FLOOR_W - doorW) / 2;
  addBox(sideW, WALL_H, WALL_T, wallC, -HALF_W + sideW / 2, WALL_H / 2, HALF_D);
  addBox(sideW, WALL_H, WALL_T, wallC, HALF_W - sideW / 2, WALL_H / 2, HALF_D);
  // Door header / lintel
  addBox(doorW, 0.55, WALL_T, trimC, 0, WALL_H - 0.275, HALF_D);
  // East / West walls — solid
  addBox(WALL_T, WALL_H, FLOOR_D, wallC, -HALF_W, WALL_H / 2, 0);
  addBox(WALL_T, WALL_H, FLOOR_D, wallC, HALF_W, WALL_H / 2, 0);
  // Glass door ajar at main entrance (south)
  const door = addBox(1.5, 2.55, 0.08, 0xa8c8e8, -0.55, 1.35, HALF_D - 0.15, {
    opacity: 0.45, roughness: 0.2, metalness: 0.3, cast: false
  });
  door.rotation.y = -0.55; // ajar
  // Door frame posts
  addBox(0.12, 2.7, 0.18, 0x6b5b4a, -doorW / 2, 1.35, HALF_D);
  addBox(0.12, 2.7, 0.18, 0x6b5b4a, doorW / 2, 1.35, HALF_D);
  // Entrance mat
  addBox(2.8, 0.04, 1.4, 0x3d4a5c, 0, 0.03, HALF_D - 1.2, { cast: false, roughness: 0.95 });
}

function buildLowPartitions() {
  // Open-plan: low half-walls (~1.15) between the 6 zones — do NOT block OrbitControls view
  const h = 1.15, t = 0.18, panelC = 0xdde3ee, railC = 0x8a94a8;
  // Vertical divider along x=0 (between L|R columns of zones), with gaps at corridors
  // North row (z ~ -7): gap between Leadership / Research / Engineering
  // Leave walkway gaps ~2.5 wide at x=±6.5 around zone boundaries
  function partitionX(x, z0, z1) {
    const len = z1 - z0, mid = (z0 + z1) / 2;
    addBox(t, h, len, panelC, x, h / 2, mid, { cast: true });
    addBox(t + 0.04, 0.06, len, railC, x, h + 0.03, mid, { cast: false });
  }
  function partitionZ(z, x0, x1) {
    const len = x1 - x0, mid = (x0 + x1) / 2;
    addBox(len, h, t, panelC, mid, h / 2, z, { cast: true });
    addBox(len, 0.06, t + 0.04, railC, mid, h + 0.03, z, { cast: false });
  }
  // Between north and south zones (z=0), leave center corridor openings
  partitionZ(0, -HALF_W + 1.5, -7.5);   // west segment
  partitionZ(0, -5.0, 5.0);             // center segment (short)
  partitionZ(0, 7.5, HALF_W - 1.5);     // east segment
  // Between Leadership | Research (x=-6.5, north)
  partitionX(-6.5, -HALF_D + 1.2, -2.2);
  // Between Research | Engineering (x=6.5, north)
  partitionX(6.5, -HALF_D + 1.2, -2.2);
  // Between Content | Personal (x=-6.5, south)
  partitionX(-6.5, 2.2, HALF_D - 1.2);
  // Between Personal | Project Teams (x=6.5, south)
  partitionX(6.5, 2.2, HALF_D - 1.2);
  // Frosted glass panel tops for a modern office feel (very low opacity)
  [[-6.5, -7], [6.5, -7], [-6.5, 7], [6.5, 7]].forEach(([x, z]) => {
    addBox(0.06, 0.55, 3.2, 0xc5d4e8, x, h + 0.35, z, { opacity: 0.35, roughness: 0.15, metalness: 0.2, cast: false });
  });
}

function addCeilingLight(x, z, color = 0xfff2dd, intensity = 1.1) {
  // Fixture housing
  addBox(1.6, 0.08, 0.5, 0xe8e8e8, x, WALL_H - 0.12, z, { cast: false, emissive: 0xfff5e0, emissiveIntensity: 0.35 });
  const pl = new THREE.PointLight(color, intensity, 18, 2);
  pl.position.set(x, WALL_H - 0.35, z);
  pl.castShadow = false; // perf: only sun casts shadows
  scene.add(pl);
}

function buildLights() {
  // One warm ceiling fixture per zone + a few corridor accents
  ZONES.forEach(z => addCeilingLight(z.x, z.z, 0xfff0d8, 1.25));
  addCeilingLight(0, 0, 0xe8f0ff, 0.7);           // center corridor
  addCeilingLight(0, HALF_D - 3, 0xfff5e6, 0.85); // near entrance
  // Glowing panel above Engineering
  addBox(4.5, 0.06, 1.2, 0x22d3ee, 13, WALL_H - 0.08, -7, {
    cast: false, emissive: 0x22d3ee, emissiveIntensity: 0.7, roughness: 0.4, metalness: 0.1
  });
  const eng = new THREE.PointLight(0xaef6ff, 1.4, 16, 2);
  eng.position.set(13, WALL_H - 0.5, -7); scene.add(eng);
}

function makePlant(x, z, scale = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(scale);
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.42, 10), mat(0x8b5a3c));
  pot.position.y = 0.21; pot.castShadow = true; g.add(pot);
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.06, 10), mat(0x3d2b1f));
  dirt.position.y = 0.42; g.add(dirt);
  const leafMat = mat(0x3d8b5a);
  [[0, 0.85, 0, 0.38], [0.18, 0.7, 0.12, 0.28], [-0.15, 0.72, -0.1, 0.26], [0.05, 1.05, -0.08, 0.22]].forEach(([lx, ly, lz, r]) => {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), leafMat);
    leaf.position.set(lx, ly, lz); leaf.castShadow = true; g.add(leaf);
  });
  scene.add(g); return g;
}

function makeWallArt(x, y, z, w, h, tint, facing = "s") {
  // Frame + tinted "picture" on outer or partition-facing walls
  const depth = 0.06;
  const frame = addBox(w + 0.12, h + 0.12, depth, 0x5c4a32, x, y, z, { cast: false });
  const pic = addBox(w, h, 0.03, tint, x, y, z + (facing === "s" ? 0.04 : facing === "n" ? -0.04 : 0), {
    cast: false, emissive: tint, emissiveIntensity: 0.15, roughness: 0.55
  });
  if (facing === "e") { frame.position.x = x; pic.position.set(x - 0.04, y, z); }
  if (facing === "w") { frame.position.x = x; pic.position.set(x + 0.04, y, z); }
  if (facing === "n") pic.position.z = z - 0.04;
  return pic;
}

function makeCabinet(x, z, rotY = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY;
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.35, 0.55), mat(0x4a5568));
  body.position.y = 0.675; body.castShadow = true; body.receiveShadow = true; g.add(body);
  for (let i = 0; i < 3; i++) {
    const drawer = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.32, 0.04), mat(0x3d4658));
    drawer.position.set(0, 0.35 + i * 0.38, 0.28); g.add(drawer);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.04, 0.04), mat(0xc0c8d4));
    handle.position.set(0, 0.35 + i * 0.38, 0.32); g.add(handle);
  }
  scene.add(g);
}

function makeBookshelf(x, z, rotY = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY;
  const shell = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.4), mat(0x6b5344));
  shell.position.y = 0.9; shell.castShadow = true; g.add(shell);
  const colors = [0x4ade80, 0x60a5fa, 0xfbbf24, 0xf472b6, 0xa78bfa, 0x22d3ee];
  for (let row = 0; row < 4; row++) {
    for (let b = 0; b < 5; b++) {
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.28 + (b % 3) * 0.04, 0.28),
        mat(colors[(row * 5 + b) % colors.length])
      );
      book.position.set(-0.5 + b * 0.25, 0.28 + row * 0.42, 0.02);
      g.add(book);
    }
  }
  scene.add(g);
}

function makeLounge(x, z) {
  // Coffee table + two lounge chairs (Leadership / open area)
  const table = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.08, 16), mat(0x8b6b4a));
  table.position.set(x, 0.42, z); table.castShadow = true; scene.add(table);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.4, 8), mat(0x3b3f4a));
  leg.position.set(x, 0.2, z); scene.add(leg);
  [[-1.3, 0.9], [1.3, 0.9]].forEach(([dx, dz], i) => {
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.35, 0.75), mat(i ? 0x7eb6ff : 0x5b8fd4));
    seat.position.set(x + dx, 0.35, z + dz); seat.castShadow = true; scene.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.7, 0.12), mat(i ? 0x7eb6ff : 0x5b8fd4));
    back.position.set(x + dx, 0.7, z + dz + 0.35); scene.add(back);
  });
}

function makeWaterCooler(x, z) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.1, 0.5), mat(0xe8eef5));
  base.position.set(x, 0.55, z); base.castShadow = true; scene.add(base);
  const jug = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.45, 12), new THREE.MeshStandardMaterial({
    color: 0x7ec8e3, transparent: true, opacity: 0.55, roughness: 0.2, metalness: 0.1
  }));
  jug.position.set(x, 1.35, z); scene.add(jug);
  const spout = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.18), mat(0x94a3b8));
  spout.position.set(x, 0.95, z + 0.28); scene.add(spout);
}

function buildAccessories() {
  // Plants in corners and near doors / partitions
  makePlant(-HALF_W + 1.4, -HALF_D + 1.4, 1.1);
  makePlant(HALF_W - 1.4, -HALF_D + 1.4, 1.0);
  makePlant(-HALF_W + 1.4, HALF_D - 1.6, 1.15);
  makePlant(HALF_W - 1.4, HALF_D - 1.6, 0.95);
  makePlant(-2.2, HALF_D - 1.5, 0.85); // near entrance
  makePlant(2.2, HALF_D - 1.5, 0.85);
  makePlant(-6.5, 0, 0.75); // along central partition
  makePlant(6.5, 0, 0.75);
  makePlant(-13, -1.5, 0.7);
  makePlant(13, 1.5, 0.7);
  makePlant(0, -HALF_D + 1.5, 0.9);

  // Wall art on north perimeter (facing south into office)
  makeWallArt(-13, 2.1, -HALF_D + 0.2, 2.2, 1.4, 0x7eb6ff, "s"); // Leadership tint
  makeWallArt(0, 2.1, -HALF_D + 0.2, 2.4, 1.3, 0x8fd0b0, "s");   // Research
  makeWallArt(13, 2.1, -HALF_D + 0.2, 2.2, 1.4, 0x22d3ee, "s");  // Engineering
  // South wall art (facing north) — avoid doorway
  makeWallArt(-13, 2.0, HALF_D - 0.2, 2.0, 1.2, 0xe07a5f, "n"); // Content
  makeWallArt(13, 2.0, HALF_D - 0.2, 2.0, 1.2, 0xf0b429, "n");  // Project Teams
  // West / east wall frames (thin panels along x)
  addBox(0.2, 1.55, 2.15, 0x5c4a32, -HALF_W + 0.12, 2.05, -7, { cast: false });
  addBox(0.08, 1.4, 2.0, 0x7eb6ff, -HALF_W + 0.2, 2.05, -7, { cast: false, emissive: 0x7eb6ff, emissiveIntensity: 0.14 });
  addBox(0.2, 1.55, 2.15, 0x5c4a32, -HALF_W + 0.12, 2.0, 7, { cast: false });
  addBox(0.08, 1.4, 2.0, 0xc4b5fd, -HALF_W + 0.2, 2.0, 7, { cast: false, emissive: 0xc4b5fd, emissiveIntensity: 0.12 });
  addBox(0.2, 1.55, 2.15, 0x5c4a32, HALF_W - 0.12, 2.0, -7, { cast: false });
  addBox(0.08, 1.4, 2.0, 0x22d3ee, HALF_W - 0.2, 2.0, -7, { cast: false, emissive: 0x22d3ee, emissiveIntensity: 0.14 });
  addBox(0.2, 1.55, 2.15, 0x5c4a32, HALF_W - 0.12, 2.0, 7, { cast: false });
  addBox(0.08, 1.4, 2.0, 0xf0b429, HALF_W - 0.2, 2.0, 7, { cast: false, emissive: 0xf0b429, emissiveIntensity: 0.12 });

  // Filing cabinets
  makeCabinet(-18, -3, Math.PI / 2);
  makeCabinet(-18, -4.3, Math.PI / 2);
  makeCabinet(18, -4, -Math.PI / 2);
  makeCabinet(18, 4, -Math.PI / 2);
  makeCabinet(-18, 5, Math.PI / 2);

  // Bookshelves
  makeBookshelf(-10, -HALF_D + 1.0, 0);
  makeBookshelf(10, -HALF_D + 1.0, 0);
  makeBookshelf(-8, HALF_D - 1.0, Math.PI);

  // Lounge in Leadership open corner
  makeLounge(-17, -10);

  // Water cooler near entrance corridor
  makeWaterCooler(4.5, HALF_D - 2.5);

  // Small plant stands / side tables
  addBox(0.55, 0.55, 0.55, 0x6b5344, -4, 0.28, -12, {});
  makePlant(-4, -12, 0.65);
  addBox(0.55, 0.55, 0.55, 0x6b5344, 4, 0.28, 12, {});
  makePlant(4, 12, 0.65);
}

buildFloor();
buildPerimeterWalls();
buildLowPartitions();
buildLights();
buildAccessories();


async function loadVoxels() {
  await Promise.all(VOXEL_IDS.map(async id => {
    try {
      const file = VOXEL_FILE[id] || id;
      const res = await fetch(`voxels/${file}.json?t=` + Date.now());
      voxelCache[id] = await res.json();
      voxelCache[id]._art = file;
    } catch (e) { console.warn("voxel load failed", id, e); }
  }));
}

function buildVoxelBot(id) {
  const data = voxelCache[id];
  if (!data) return null;
  const g = new THREE.Group();
  // Billboard: official voxel art (always faces camera)
  const art = (data && data._art) || id;
  const tex = new THREE.TextureLoader().load(`portraits/voxels/${art}.png`);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(1.7, 2.5, 1);
  spr.position.set(0, 1.3, 0);
  spr.userData.id = id;
  g.add(spr);
  clickable.push(spr);
  // Small voxel "shadow body" under the sprite for 3D depth
  const cell = data.cell || 0.06;
  const geo = new THREE.BoxGeometry(cell, cell, cell);
  const bodyMat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.05 });
  // only use lower third of voxels (legs/feet) for a stub
  const feet = data.voxels.filter(v => v[1] < 0.55);
  const mesh = new THREE.InstancedMesh(geo, bodyMat, Math.max(feet.length, 1));
  mesh.castShadow = true;
  const dummy = new THREE.Object3D();
  const c = new THREE.Color();
  feet.forEach((v, i) => {
    dummy.position.set(v[0], v[1], v[2]);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    c.setRGB(v[3]/255, v[4]/255, v[5]/255);
    mesh.setColorAt(i, c);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  const maxY = Math.max(...data.voxels.map(v => v[1]), 0.1);
  const stub = new THREE.Group();
  stub.add(mesh);
  stub.scale.setScalar(2.4 / maxY);
  stub.position.y = 0;
  stub.visible = false; // art sprite carries the look; stub reserved
  g.add(stub);
  g.userData.sprite = spr;
  return g;
}

function makeDesk(id, name, role, zone, x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const top = new THREE.Mesh(new THREE.BoxGeometry(3, 0.15, 1.6), mat(0x8b6b4a)); top.position.y = 1.1;
  g.add(top);
  for (const [lx, lz] of [[-1.35, -0.65], [1.35, -0.65], [-1.35, 0.65], [1.35, 0.65]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.1), mat(0x3b3f4a)); leg.position.set(lx, 0.55, lz); g.add(leg);
  }
  const screen = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 0.08), mat(0x111827)); screen.position.set(0, 1.7, -0.45); g.add(screen);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.28, 0.72), new THREE.MeshBasicMaterial({ color: zone.color, transparent: true, opacity: 0.35 }));
  glow.position.set(0, 1.7, -0.4); g.add(glow);
  const chair = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.9), mat(0x2b3550)); chair.position.set(0, 0.7, 1.3); g.add(chair);
  const bot = new THREE.Group(); bot.position.set(0, 0, 1.3); g.add(bot);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.7, 4, 12), mat(zone.color)); body.position.set(0, 1.35, 0); bot.add(body);
  const head = new THREE.Group(); head.position.set(0, 2.2, 0); bot.add(head);
  head.add(new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 16), mat(0xf1d3b3)));
  for (const ex of [-0.11, 0.11]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), new THREE.MeshBasicMaterial({ color: 0x1f2937 }));
    eye.position.set(ex, 0.05, -0.29); head.add(eye);
  }
  const mkArm = side => {
    const p = new THREE.Group(); p.position.set(side * 0.47, 1.68, 0);
    const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.5, 4, 8), mat(zone.color)); a.position.y = -0.33; p.add(a);
    bot.add(p); return p;
  };
  const armL = mkArm(-1), armR = mkArm(1);
  const light = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), new THREE.MeshBasicMaterial({ color: STATE_COLOR.idle }));
  light.position.set(0, 2.85, 0); bot.add(light);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.userData.id = id; clickable.push(o); } });
  const el = document.createElement("div"); el.className = "tag"; el.innerHTML = `<b>${name}</b><i>...</i>`;
  const tag = new CSS2DObject(el); tag.position.set(0, 3.4, 1.3); g.add(tag);
  let portraitObj = null;
  let voxel = null;
  if (VOXEL_IDS.includes(id) && voxelCache[id]) {
    voxel = buildVoxelBot(id);
    if (voxel) {
      voxel.position.set(0, 0, 1.1);
      g.add(voxel);
      bot.visible = false;
      light.position.set(0, 2.7, 1.1); g.add(light);
      tag.position.set(0, 3.0, 1.1);
    }
  } else if (PORTRAITS[id]) {
    const wrap = document.createElement("div"); wrap.className = "portrait-wrap";
    const img = document.createElement("img"); img.className = "portrait"; img.src = PORTRAITS[id]; img.alt = name;
    wrap.appendChild(img);
    portraitObj = new CSS2DObject(wrap); portraitObj.position.set(0, 2.55, 1.3); g.add(portraitObj);
    bot.visible = false;
    light.position.set(0, 3.15, 1.3); g.add(light);
  }
  scene.add(g);
  desks[id] = { name, role, zone: zone.name, light, body, head, bot, armL, armR, glow, el, portraitObj, voxel, state: "idle", task: "",
    w: { working: 0, waiting: 0, idle: 1 }, phase: Math.random() * 10, target: new THREE.Color(STATE_COLOR.idle) };
}


async function boot() {
  await loadVoxels();
for (const zone of ZONES) {
  // Distinct zone carpet on warmer wood floor
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(14, 11.5), new THREE.MeshStandardMaterial({
    color: zone.color, transparent: true, opacity: 0.28, roughness: 0.95
  }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(zone.x, 0.025, zone.z); rug.receiveShadow = true; scene.add(rug);
  // Carpet border strip
  const border = new THREE.Mesh(new THREE.PlaneGeometry(14.3, 11.8), new THREE.MeshStandardMaterial({
    color: zone.color, transparent: true, opacity: 0.12, roughness: 0.9
  }));
  border.rotation.x = -Math.PI / 2; border.position.set(zone.x, 0.022, zone.z); scene.add(border);
  const zl = document.createElement("div"); zl.className = "zone"; zl.textContent = zone.name;
  const zo = new CSS2DObject(zl); zo.position.set(zone.x, 0.1, zone.z + 4.7); scene.add(zo);
  const n = zone.bots.length, cols = n > 2 ? 2 : n;
  zone.bots.forEach(([id, name, role], i) => {
    const c = i % cols, r = Math.floor(i / cols), rows = Math.ceil(n / cols);
    makeDesk(id, name, role, zone, zone.x + (c - (cols - 1) / 2) * 5, zone.z + (r - (rows - 1) / 2) * (rows > 2 ? 3.3 : 4.2) - 0.6);
  });
}

let selected = null;
function showPanel(id) {
  const d = desks[id]; if (!d) return; selected = id;
  document.getElementById("p-team").textContent = d.zone;
  document.getElementById("p-name").textContent = d.name;
  document.getElementById("p-role").textContent = d.role;
  const word = { working: "Working on", waiting: "Waiting on Danny:", idle: "Idle." }[d.state];
  document.getElementById("p-now").textContent = d.state === "idle" ? `Idle. ${d.task}` : `${word} ${d.task}`;
  document.getElementById("panel").style.display = "block";
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener("click", e => {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickable)[0]; if (hit) showPanel(hit.object.userData.id);
});


  loadStatus(); setInterval(loadStatus, 5000);
}
boot();
async function loadStatus() {
  try {
    const res = await fetch("status.json?t=" + Date.now()); const data = await res.json();
    for (const [id, s] of Object.entries(data.bots || {})) {
      const d = desks[id]; if (!d) continue;
      d.state = STATE_COLOR[s.state] ? s.state : "idle"; d.task = s.task || "";
      d.target.setHex(STATE_COLOR[d.state]);
      d.el.querySelector("i").textContent = d.state === "idle" ? "idle" : d.task;
    }
    document.getElementById("updated").textContent = "Status updated " + new Date(data.updated).toLocaleString("en-GB", { timeZone: "Asia/Jakarta", dateStyle: "medium", timeStyle: "short" }) + " WIB";
    if (selected) showPanel(selected);
  } catch (e) { document.getElementById("updated").textContent = "Couldn't read status.json"; }
}
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt * 2.5);
  for (const d of Object.values(desks)) {
    for (const s of ["working", "waiting", "idle"]) d.w[s] += ((d.state === s ? 1 : 0) - d.w[s]) * k;
    const { working: W, waiting: A, idle: I } = d.w, p = d.phase;
    // Working: typing hands and a small bob. Waiting: turn round and wave. Idle: breathe and look around.
    d.armL.rotation.x = W * (1.15 + Math.sin(t * 14 + p) * 0.15) + I * 0.1 * Math.sin(t * 1.2 + p);
    d.armR.rotation.x = W * (1.15 + Math.sin(t * 14 + p + Math.PI) * 0.15);
    d.armR.rotation.z = A * (2.5 + Math.sin(t * 7 + p) * 0.35);
    d.armL.rotation.z = 0;
    d.bot.rotation.y = A * Math.PI;
    d.body.position.y = 1.35 + W * Math.abs(Math.sin(t * 7 + p)) * 0.04;
    d.body.scale.set(1 + I * Math.sin(t * 1.8 + p) * 0.025, 1 + I * Math.sin(t * 1.8 + p) * 0.04, 1);
    d.head.rotation.y = I * Math.sin(t * 0.45 + p) * 0.7 + A * Math.sin(t * 2 + p) * 0.15;
    d.head.rotation.x = W * (0.18 + Math.sin(t * 3 + p) * 0.03) - A * 0.1;
    d.head.position.y = 2.2 + I * Math.sin(t * 1.8 + p) * 0.02;

    if (d.voxel && d.voxel.userData.sprite) {
      const spr = d.voxel.userData.sprite;
      spr.position.y = 1.3 + W * Math.abs(Math.sin(t * 7 + p)) * 0.08 + I * Math.sin(t * 1.8 + p) * 0.03;
      spr.scale.x = A ? -1.7 : 1.7; // flip when waiting
    }
    if (d.portraitObj) {
      const elp = d.portraitObj.element;
      const bob = W * Math.abs(Math.sin(t * 7 + p)) * 4 + I * Math.sin(t * 1.8 + p) * 2;
      const turn = A ? "scaleX(-1)" : "scaleX(1)";
      elp.style.transform = `translateY(${-bob}px) ${turn}`;
    }
    d.light.material.color.lerp(d.target, k);
    d.light.scale.setScalar(1 + A * Math.sin(t * 4) * 0.3);
    d.glow.material.opacity = 0.2 + W * (0.35 + Math.sin(t * 9 + p) * 0.05) + A * 0.1;
  }
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});
</script>
